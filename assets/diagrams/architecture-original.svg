<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="465" viewBox="0 0 1024 465" preserveAspectRatio="none" role="img" aria-labelledby="title desc" xml:lang="ko">
  <title id="title">NIHON · 기기 저장과 온라인 번역 경로</title>
  <desc id="desc">수록 회화는 브라우저에서 찾습니다. 저장한 표현과 기록은 localStorage에, 오프라인 화면과 음원은 Cache Storage에 남습니다. 자유 문장은 Vercel을 거쳐 Azure Translator와 주고받습니다. Vercel이 Azure에서 임시 토큰을 받아 브라우저에 건네면, 브라우저가 Azure Speech에 직접 연결해 음성을 번역하거나 일본어를 읽습니다.</desc>
  <style>text {font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;letter-spacing:-.35px}
    .en {font-family:"Helvetica Neue",Arial,sans-serif;letter-spacing:1.15px}
    .n {font-family:"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.75px}
    .signal,.focus {opacity:0;pointer-events:none}
    @media (prefers-reduced-motion:no-preference) {
      .signal {stroke-dasharray:13 110;animation:travel 5.8s var(--delay,0s) ease-in-out infinite}
      .focus {animation:focus 5.8s var(--delay,0s) ease-out infinite;transform-box:fill-box;transform-origin:center}
    }
    @keyframes travel {0%,4%{stroke-dashoffset:15;opacity:0}12%{opacity:1}48%{stroke-dashoffset:-101;opacity:1}55%,100%{stroke-dashoffset:-105;opacity:0}}
    @keyframes focus {0%,6%{opacity:0;transform:scale(.75)}17%{opacity:.52}38%,100%{opacity:0;transform:scale(1.45)}}
    :root {display:block;max-width:100%;height:auto;margin-inline:auto}
    .portrait-layout {display:none}
    /* 단독 SVG를 휴대폰에서 열 때도 README와 같은 세로 구도로 읽는다. */
    @media (max-device-width:640px) and (min-height:460px), (max-width:640px) and (min-height:460px) {
      :root {width:100vw;max-width:none;height:129.25vw}
      .wide-layout {display:none}
      .portrait-layout {display:inline}
    }
  </style>

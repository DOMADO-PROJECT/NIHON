<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="562" viewBox="0 0 1024 562" preserveAspectRatio="none" role="img" aria-labelledby="title desc" xml:lang="ko">
  <title id="title">NIHON · 음원 요청 시점을 옮겨 줄인 재생 대기</title>
  <desc id="desc">기존 구현은 재생 버튼을 눌러야 MP3를 요청했습니다. 최적화한 구현은 회화가 보이거나 MY에서 목소리를 고를 때 음원을 요청하고, 누르면 준비한 오디오로 재생합니다. 버튼을 누른 뒤 재생이 시작되기까지 중앙값은 내 말 325ms에서 11ms, 상대 말 323ms에서 14ms, MY 예문 356ms에서 46ms였습니다. 로컬 Chrome에서 MP3 요청을 300ms 늦추고 각 조건을 다섯 번 측정했습니다.</desc>
  <style>text {font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;letter-spacing:-.35px}

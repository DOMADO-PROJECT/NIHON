      <text class="detail" x="122" y="109">Translator · 문자 번역</text>
      <text class="detail" x="122" y="135">Speech · 음성 번역과 읽기</text>
    </g>
  </defs>
  <rect width="400" height="720" fill="#FFFFFF"/>
  <g id="diagram-header">
    <use href="#app-mark" x="18" y="18" width="25" height="25" color="#22262D"/>
    <use href="#wordmark" x="50" y="23" width="70" height="15" color="#22262D"/>
    <text x="133" y="35" font-size="11" font-weight="700" fill="#BC002D" text-anchor="start" class="en">ARCHITECTURE</text>
    <text x="382" y="35" font-size="12" font-weight="520" fill="#5E6877" text-anchor="end">전체 구조</text>
    <path d="M18 56H382" fill="none" stroke="#D5DAE0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g class="map" transform="translate(0 8)">
    <use href="#browser-node" x="78" y="84"/>
    <path class="wire" d="M200 252V272"/>
    <use href="#vercel-node" x="78" y="280"/>
    <path class="wire" d="M200 448V468"/>
    <use href="#azure-node" x="78" y="476"/>
    <path class="wire direct" d="M330 164H352Q366 164 366 178V654Q366 668 352 668H214Q200 668 200 654V644"/>
    <text class="direct-label" x="283" y="692">토큰 발급 후 음성 직접 연결</text>
  </g>
</svg>

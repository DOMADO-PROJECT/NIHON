<svg xmlns="http://www.w3.org/2000/svg" width="400" height="720" viewBox="0 0 400 720" preserveAspectRatio="none" role="img" aria-labelledby="title" aria-describedby="desc" xml:lang="ko">
  <title id="title">NIHON · 브라우저, Vercel, Azure의 연결 구조</title>
  <desc id="desc">브라우저는 Vercel에서 Next.js 화면과 MP3를 받아 수록 회화를 기기에서 찾습니다. 저장한 표현과 대화 기록은 localStorage에, 오프라인 화면과 MP3는 서비스 워커가 Cache Storage에 보관합니다. 목록에 없는 문장은 Vercel의 text-translation을 거쳐 Azure Translator가 번역합니다. 브라우저가 speech-token을 통해 Azure Speech의 임시 토큰을 받으면 음성 번역과 일본어 읽기는 Azure Speech와 직접 주고받습니다.</desc>
  <style>
    :root { display: block; max-width: 100%; height: auto; margin-inline: auto; }
    text { font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; letter-spacing: -.35px; }
    .en, .latin { font-family: "Helvetica Neue", Arial, sans-serif; }
    .en { letter-spacing: 1.15px; }
    .map { fill: #24272D; color: #344154; text-anchor: middle; }
    .node-title { font-size: 23px; font-weight: 700; }
    .detail { font-size: 17px; fill: #4B5B72; }
    .wire { fill: none; stroke: #8290A2; stroke-width: 1.6; stroke-linecap: round; marker-start: url(#arrow); marker-end: url(#arrow); }
    .direct { stroke-width: 1.25; }
    .direct-label { font-size: 14px; font-weight: 520; fill: #59687B; }
  </style>

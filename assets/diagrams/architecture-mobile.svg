    <symbol id="browser-icon" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><rect x="2.5" y="4.5" width="19" height="15" rx="3"/><path d="M3 9h18"/></g></symbol>
    <symbol id="vercel-mark" viewBox="0 0 24 24"><path d="m1 20 11-18 11 18Z" fill="currentColor"/></symbol>
    <symbol id="cloud" viewBox="0 0 24 24"><path d="M6.5 18.5a4.5 4.5 0 0 1-.2-9 6 6 0 0 1 11.5-1.3 5.2 5.2 0 0 1-.5 10.3Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>

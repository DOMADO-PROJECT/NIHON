      <path d="M286 4H310C317.732 4 324 10.268 324 18V202C324 209.732 317.732 216 310 216H286C278.268 216 272 209.732 272 202V18C272 10.268 278.268 4 286 4Z" fill="#24272D"/>
      <path d="M396 4H420C427.732 4 434 10.268 434 18V84H530V18C530 10.268 536.268 4 544 4H568C575.732 4 582 10.268 582 18V202C582 209.732 575.732 216 568 216H544C536.268 216 530 209.732 530 202V130H434V202C434 209.732 427.732 216 420 216H396C388.268 216 382 209.732 382 202V18C382 10.268 388.268 4 396 4Z" fill="#24272D"/>
      <path d="M880 4H904C910 4 914 6 918 11L1024 132V18C1024 10.268 1030.268 4 1038 4H1062C1069.732 4 1076 10.268 1076 18V202C1076 209.732 1069.732 216 1062 216H1038C1032 216 1028 214 1024 209L918 89V202C918 209.732 911.732 216 904 216H880C872.268 216 866 209.732 866 202V18C866 10.268 872.268 4 880 4Z" fill="#24272D"/>

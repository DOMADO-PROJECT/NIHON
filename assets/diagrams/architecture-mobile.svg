      <path d="M239 255C246 251 254 253 259 259C264 266 263 272 258 278C254 283 257 289 265 293C280 299 303 300 325 296C337 294 344 300 345 310C346 320 340 327 330 329C297 334 264 332 242 323C222 315 214 304 215 286C215 272 222 259 239 255Z" fill="#BC002D"/>
    </symbol>
    <symbol id="wordmark" viewBox="0 0 1080 224">

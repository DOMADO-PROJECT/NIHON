<svg xmlns="http://www.w3.org/2000/svg" width="400" height="881" viewBox="0 0 400 881" role="img" aria-labelledby="title desc" xml:lang="ko">
  <title id="title">NIHON · 시스템 아키텍처</title>
  <desc id="desc">세 열은 왼쪽부터 브라우저, Vercel, Azure입니다. 회화 검색과 수록 문장 번역은 기기에서 끝납니다. 자유 문장은 Vercel 함수가 Azure Translator에 보냅니다. 음성은 브라우저가 임시 토큰을 받아 Azure Speech와 직접 주고받습니다.</desc>
  <style>
    text { font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; letter-spacing: -.3px; }
    .en { font-family: "Helvetica Neue", Arial, sans-serif; letter-spacing: 1.35px; }
    .ja { font-family: "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif; letter-spacing: -.8px; }
    .num { font-family: "Helvetica Neue", Arial, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -.7px; }
    .trace, .tip { opacity: 0; }
    .trace { stroke-dasharray: 1; stroke-dashoffset: 1; }
    @media (prefers-reduced-motion: no-preference) {
      .trace { animation: draw var(--cycle,7s) var(--offset,0s) ease-in-out infinite both; }
      .tip { animation: arrive var(--cycle,7s) var(--offset,0s) ease-in-out infinite both; }
    }
    @keyframes draw { 0%,5% {opacity:0;stroke-dashoffset:1} 10% {opacity:1;stroke-dashoffset:1} 28%,54% {opacity:1;stroke-dashoffset:0} 68%,100% {opacity:0;stroke-dashoffset:0} }
    @keyframes arrive { 0%,26%,68%,100% {opacity:0} 32%,54% {opacity:1} }

    .wire-label { paint-order: stroke; stroke: white; stroke-width: 6px; stroke-linejoin: round; }
  </style>

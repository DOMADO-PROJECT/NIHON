    </marker>

    <g id="browser-node">
      <rect width="244" height="160" rx="18" fill="#EFF2F5"/>
      <use href="#browser-icon" x="111" y="20" width="22" height="22"/>
      <text class="node-title" x="122" y="73">여행자 브라우저</text>
      <text class="detail" x="122" y="109">수록 회화 검색 · 표현 저장</text>
      <text class="detail" x="122" y="135">화면과 음원 오프라인 보관</text>
    </g>
    <g id="vercel-node">
      <rect width="244" height="160" rx="18" fill="#F5F6F8"/>
      <use href="#vercel-mark" x="111" y="20" width="22" height="22"/>
      <text class="node-title latin" x="122" y="73">Vercel</text>
      <text class="detail" x="122" y="109">화면과 MP3 배포</text>
      <text class="detail" x="122" y="135">번역 요청 · 임시 토큰 중계</text>
    </g>
    <g id="azure-node">
      <rect width="244" height="160" rx="18" fill="#F5F6F8"/>
      <use href="#cloud" x="110" y="19" width="24" height="24"/>

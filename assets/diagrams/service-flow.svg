  <text x="208" y="413" font-size="23" font-weight="675" fill="#24272D">내가 말하기 / 상대가 말하기</text>
  <text x="208" y="442" font-size="18" font-weight="450" fill="#475467">화자를 고르고 한 문장 말하기</text>
  <text x="610" y="413" font-size="23" font-weight="675" fill="#24272D">한국어 → 일본어</text>

  <text x="208" y="184" font-size="23" font-weight="675" fill="#24272D">상황 선택 · 한국어 검색</text>
  <text x="208" y="213" font-size="18" font-weight="450" fill="#475467">식당·카페 / 편의점·쇼핑 / 교통·길찾기</text>
  <text x="208" y="238" font-size="18" font-weight="450" fill="#475467">숙소 / 공항 / 도움 요청</text>
  <text x="610" y="184" font-size="23" font-weight="675" fill="#24272D">행동별 회화 · 인원 선택</text>
  <text x="610" y="213" font-size="18" font-weight="450" fill="#475467">일본어, 한글 발음, 뜻</text>
  <text x="960" y="184" font-size="23" font-weight="675" fill="#24272D">듣기 · 크게 보여주기 · 저장</text>
  <text x="960" y="213" font-size="18" font-weight="450" fill="#475467">예상 상대 말 펼치기 → 이어서 할 말</text>

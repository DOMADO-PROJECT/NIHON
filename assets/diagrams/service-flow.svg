  <text x="208" y="746" font-size="23" font-weight="675" fill="#24272D">내가 할 말 / 상대의 말</text>
  <text x="208" y="775" font-size="18" font-weight="450" fill="#475467">목소리를 바꿀 역할 선택</text>
  <text x="610" y="746" font-size="23" font-weight="675" fill="#24272D">다섯 목소리 미리 듣기</text>
  <text x="610" y="775" font-size="18" font-weight="450" fill="#475467">마이 · 니세 · 아이다 시게루</text>
  <text x="610" y="800" font-size="18" font-weight="450" fill="#475467">호노카 · 쇼조 박사</text>
  <text x="960" y="746" font-size="23" font-weight="675" fill="#24272D">이 목소리로 설정</text>
  <text x="960" y="775" font-size="18" font-weight="450" fill="#475467">역할별로 다음 재생에 반영</text>

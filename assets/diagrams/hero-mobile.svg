<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260" role="img" aria-labelledby="title" aria-describedby="desc" xml:lang="ko">
  <title id="title">NIHON · 일본 여행 회화</title>
  <desc id="desc">말이 서툴러도, 여행은 즐겁게. 일본에서 필요한 말, NIHON이 도와줄게요. 가운데 놓인 로고에 に가 그려진 뒤, 로고가 위로 이동하며 제목과 부제가 나타납니다.</desc>
  <style>
    text {
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      letter-spacing: -.3px;
    }

    @media (prefers-reduced-motion: no-preference) {
      .logo, .bubble, .ink, .ink path, .headline, .subtitle {
        animation-duration: 5s;
        animation-timing-function: cubic-bezier(.2, .8, .2, 1);
        animation-iteration-count: infinite;
      }

      .logo { animation-name: lift-logo; }
      .bubble {
        transform-box: fill-box;
        transform-origin: center;
        animation-name: bounce;
      }

      .ink { animation-name: reset-ink; }
      .ink path {
        stroke-dasharray: 1;
        animation-timing-function: ease-in-out;
      }
      .ink path:nth-child(1) { animation-name: write-first; }
      .ink path:nth-child(2) { animation-name: write-second; }
      .ink path:nth-child(3) { animation-name: write-third; }
      .headline { animation-name: reveal-headline; }
      .subtitle { animation-name: reveal-subtitle; }
    }

    @keyframes write-first {
      0%, 4% { stroke-dashoffset: 1; }
      8%, 100% { stroke-dashoffset: 0; }
    }
    @keyframes write-second {
      0%, 8.2% { stroke-dashoffset: 1; }
      11%, 100% { stroke-dashoffset: 0; }
    }
    @keyframes write-third {
      0%, 11.2% { stroke-dashoffset: 1; }
      15.2%, 100% { stroke-dashoffset: 0; }
    }
    @keyframes bounce {
      0%, 16%, 26.4%, 100% { transform: none; }
      17.2% {
        transform: translateY(2%) scale(1.06, .92);
        animation-timing-function: cubic-bezier(.333, .667, .667, 1);
      }
      20.6% {
        transform: translateY(-14%) scale(.985, 1.035);
        animation-timing-function: cubic-bezier(.333, 0, .667, .333);
      }
      23% { transform: translateY(1%) scale(1.045, .94); }
      24.8% { transform: translateY(-3%) scale(.995, 1.018); }
    }
    @keyframes lift-logo {
      0%, 24.8%, 100% { transform: translateY(46px); }
      37.2%, 93% { transform: translateY(0); animation-timing-function: ease-in-out; }
    }
    @keyframes reveal-headline {
      0%, 27.2%, 100% { opacity: 0; }
      33.6%, 92% { opacity: 1; }
    }
    @keyframes reveal-subtitle {
      0%, 30.4%, 100% { opacity: 0; }
      37.2%, 92% { opacity: 1; }
    }
    @keyframes reset-ink {
      0%, 92% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
  <rect width="100%" height="100%" fill="#F6F7F9"/>
  <g class="logo">
    <svg x="110" y="65" width="180" height="38" viewBox="0 0 1080 224" overflow="visible">
      <g fill="#24272D">
        <path d="M18 4H42C48 4 52 6 56 11L162 132V18C162 10.268 168.268 4 176 4H200C207.732 4 214 10.268 214 18V202C214 209.732 207.732 216 200 216H176C170 216 166 214 162 209L56 89V202C56 209.732 49.732 216 42 216H18C10.268 216 4 209.732 4 202V18C4 10.268 10.268 4 18 4Z"/>
        <path d="M286 4H310C317.732 4 324 10.268 324 18V202C324 209.732 317.732 216 310 216H286C278.268 216 272 209.732 272 202V18C272 10.268 278.268 4 286 4Z"/>
        <path d="M396 4H420C427.732 4 434 10.268 434 18V84H530V18C530 10.268 536.268 4 544 4H568C575.732 4 582 10.268 582 18V202C582 209.732 575.732 216 568 216H544C536.268 216 530 209.732 530 202V130H434V202C434 209.732 427.732 216 420 216H396C388.268 216 382 209.732 382 202V18C382 10.268 388.268 4 396 4Z"/>
        <path d="M880 4H904C910 4 914 6 918 11L1024 132V18C1024 10.268 1030.268 4 1038 4H1062C1069.732 4 1076 10.268 1076 18V202C1076 209.732 1069.732 216 1062 216H1038C1032 216 1028 214 1024 209L918 89V202C918 209.732 911.732 216 904 216H880C872.268 216 866 209.732 866 202V18C866 10.268 872.268 4 880 4Z"/>
      </g>
      <g class="bubble">
        <path d="M724 4 C783.646 4 832 52.354 832 112 C832 171.646 783.646 220 724 220 C706.2 220 689.4 215.7 674.6 208 C672.5 206.9 670 206.8 667.6 207.8 L639.3 220.8 C630 224.9 622 219.4 624.2 211.2 C624.9 208.8 626.3 206.9 628 204.8 L641.8 184.6 C643.8 181.8 643.8 179.5 641.6 176.7 C625.7 157.9 616 135.5 616 112 C616 52.354 664.354 4 724 4Z" fill="#BC002D"/>
        <svg x="616" y="4" width="216" height="216" viewBox="70 65 372 372">
          <defs>
            <clipPath id="ni">
              <path d="M195 162C205 164 210 171 207 180C197 224 196 273 204 317C206 328 199 336 189 337C179 338 172 332 170 322C161 271 162 221 173 174C175 164 184 160 195 162Z"/>
              <path d="M248 177C272 174 304 174 328 177C338 178 343 184 342 194C341 203 335 208 326 208C301 206 275 206 249 209C238 210 232 204 232 194C232 184 238 179 248 177Z"/>
              <path d="M239 255C246 251 254 253 259 259C264 266 263 272 258 278C254 283 257 289 265 293C280 299 303 300 325 296C337 294 344 300 345 310C346 320 340 327 330 329C297 334 264 332 242 323C222 315 214 304 215 286C215 272 222 259 239 255Z"/>
            </clipPath>
          </defs>
          <g class="ink" clip-path="url(#ni)" fill="none" stroke="#FFFFFF" stroke-width="52">
            <path d="M198 144Q166 246 192 355" pathLength="1"/>
            <path d="M215 197Q282 185 359 194" pathLength="1"/>
            <path d="M266 247C252 256 236 268 236 286C235 312 280 321 357 309" pathLength="1"/>
          </g>
        </svg>
      </g>
    </svg>
  </g>
  <text class="headline" x="200" y="152" text-anchor="middle" fill="#24272D" font-size="25" font-weight="700">말이 서툴러도, 여행은 즐겁게.</text>
  <text class="subtitle" x="200" y="186" text-anchor="middle" fill="#4B5B72" font-size="16">일본에서 필요한 말, NIHON이 도와줄게요.</text>
</svg>
